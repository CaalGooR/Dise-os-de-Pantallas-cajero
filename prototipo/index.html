<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MODO · Kiosco de Cambio de Divisas — Prototipo v2</title>
  <link rel="icon" href="assets/img/modo-isotipo.png">
  <link rel="stylesheet" href="css/tokens.css">
  <link rel="stylesheet" href="css/kiosk.css">
  <link rel="stylesheet" href="css/preview.css">
</head>
<body>

<!-- ===================== Sprite de iconos y banderas ===================== -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
  <defs>
    <clipPath id="flag-clip"><rect width="28" height="20" rx="3"/></clipPath>
  </defs>

  <symbol id="flag-us" viewBox="0 0 28 20">
    <g clip-path="url(#flag-clip)">
      <rect width="28" height="20" fill="#fff"/>
      <g fill="#c8102e">
        <rect y="0" width="28" height="1.54"/><rect y="3.08" width="28" height="1.54"/>
        <rect y="6.15" width="28" height="1.54"/><rect y="9.23" width="28" height="1.54"/>
        <rect y="12.31" width="28" height="1.54"/><rect y="15.38" width="28" height="1.54"/>
        <rect y="18.46" width="28" height="1.54"/>
      </g>
      <rect width="12" height="10.77" fill="#3c3b6e"/>
      <g fill="#fff">
        <circle cx="2" cy="2" r=".7"/><circle cx="5" cy="2" r=".7"/><circle cx="8" cy="2" r=".7"/><circle cx="10.5" cy="2" r=".7"/>
        <circle cx="3.5" cy="4.4" r=".7"/><circle cx="6.5" cy="4.4" r=".7"/><circle cx="9.5" cy="4.4" r=".7"/>
        <circle cx="2" cy="6.8" r=".7"/><circle cx="5" cy="6.8" r=".7"/><circle cx="8" cy="6.8" r=".7"/><circle cx="10.5" cy="6.8" r=".7"/>
        <circle cx="3.5" cy="9" r=".7"/><circle cx="6.5" cy="9" r=".7"/><circle cx="9.5" cy="9" r=".7"/>
      </g>
    </g>
  </symbol>

  <symbol id="flag-mx" viewBox="0 0 28 20">
    <g clip-path="url(#flag-clip)">
      <rect width="9.34" height="20" fill="#006847"/>
      <rect x="9.33" width="9.34" height="20" fill="#fff"/>
      <rect x="18.66" width="9.34" height="20" fill="#ce1126"/>
      <circle cx="14" cy="10" r="2.6" fill="#a47c3b"/>
      <circle cx="14" cy="10" r="1.5" fill="#6a8a3a"/>
    </g>
  </symbol>

  <g fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
    <symbol id="i-check" viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"/></symbol>
    <symbol id="i-alert" viewBox="0 0 24 24"><path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3"/><path d="M12 9v4"/><path d="M12 17h.01"/></symbol>
    <symbol id="i-x-circle" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="m15 9-6 6"/><path d="m9 9 6 6"/></symbol>
    <symbol id="i-arrow-right" viewBox="0 0 24 24"><path d="M5 12h14"/><path d="m12 5 7 7-7 7"/></symbol>
    <symbol id="i-clock" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></symbol>
  </g>
</svg>

<div class="pv" id="pv">

  <!-- ===================== Panel de revisión (no es parte del diseño) ===================== -->
  <aside class="pv-panel" id="pvPanel">
    <div class="pv-brand">
      <img src="assets/img/modo-isotipo.png" alt="">
      <div><b>Kiosco MODO</b><span>Prototipo de diseño · v2</span></div>
    </div>

    <section>
      <h4>Resolución</h4>
      <div class="pv-seg pv-seg--col" id="pvRes">
        <button type="button" data-res="landscape">Horizontal <small>1280 × 1024</small></button>
        <button type="button" data-res="portrait">Vertical <small>1080 × 1920</small></button>
        <button type="button" data-res="free">Libre <small>responsivo</small></button>
      </div>
    </section>

    <section>
      <h4>Ir a pantalla</h4>
      <select id="pvScreen" aria-label="Ir a pantalla"></select>
    </section>

    <section>
      <h4>Idioma</h4>
      <div class="pv-seg" id="pvLang">
        <button type="button" data-lang="es">Español</button>
        <button type="button" data-lang="en">English</button>
      </div>
    </section>

    <section>
      <h4>Tipo de cambio en vivo <small>(una sola fuente)</small></h4>
      <div class="pv-rate">
        <button type="button" class="pv-btn" id="pvRateDown">−0.05</button>
        <output id="pvRateVal">18.38</output>
        <button type="button" class="pv-btn" id="pvRateUp">+0.05</button>
      </div>
    </section>

    <section>
      <h4>Configuración</h4>
      <label class="pv-check"><input type="checkbox" id="pvFee" checked> Mostrar “Sin comisión”</label>
      <label class="pv-check"><input type="checkbox" id="pvTable"> Tabla de equivalencias (inicio)</label>
      <label class="pv-check"><input type="checkbox" id="pvDynCap"> Tope dinámico (300 USD)</label>
      <label class="pv-check"><input type="checkbox" id="pvEscrow" checked> Receptor con escrow (cancelar)</label>
      <label class="pv-check"><input type="checkbox" id="pvOos"> Kiosco fuera de servicio</label>
    </section>

    <section>
      <h4>Simulador de billetes <small>(pantalla 2)</small></h4>
      <div class="pv-bills" id="pvBills"></div>
      <div class="pv-reasons">
        <button type="button" class="pv-btn" data-reason="damaged">Dañado</button>
        <button type="button" class="pv-btn" data-reason="serial">Serie</button>
        <button type="button" class="pv-btn" data-reason="misplaced">Mal puesto</button>
      </div>
    </section>

    <section>
      <h4>Fallas y estados</h4>
      <label class="pv-check"><input type="checkbox" id="pvFail"> Error de inventario al validar</label>
      <label class="pv-check"><input type="checkbox" id="pvFailDelivery"> Falla al entregar (incidencia)</label>
      <label class="pv-check"><input type="checkbox" id="pvIdle"> Inactividad / auto-reinicio</label>
    </section>

    <section class="pv-row">
      <button type="button" class="pv-btn" id="pvReset">Reiniciar</button>
      <button type="button" class="pv-btn" id="pvHide">Ocultar panel</button>
    </section>

    <p class="pv-help">Tecla <kbd>P</kbd> muestra u oculta este panel.</p>
  </aside>

  <main class="pv-viewport" id="pvViewport">
    <button type="button" class="pv-show" id="pvShow" hidden>Panel</button>

    <div class="pv-frame" id="pvFrame">
      <div class="stage" id="stage">

        <!-- ===================== KIOSCO ===================== -->
        <div class="kiosk" id="kiosk" data-screen="start">
          <div class="bg" aria-hidden="true"></div>

          <header class="topbar">
            <img class="topbar__logo" src="assets/img/modo-logo.png" alt="MODO">
            <div class="clock">
              <div class="clock__date" id="clockDate"></div>
              <div class="clock__time" id="clockTime"></div>
            </div>
          </header>

          <ol class="stepper" id="stepper" hidden>
            <li class="step" data-step="1"><span class="step__dot"></span><span class="step__label" data-i18n="step.start"></span></li>
            <li class="step" data-step="2"><span class="step__dot"></span><span class="step__label" data-i18n="step.bills"></span></li>
            <li class="step" data-step="3"><span class="step__dot"></span><span class="step__label" data-i18n="step.confirm"></span></li>
            <li class="step" data-step="4"><span class="step__dot"></span><span class="step__label" data-i18n="step.delivery"></span></li>
          </ol>

          <div class="content">

            <!-- ── 1 · Inicio: espera + tipo de cambio + idioma + privacidad ── -->
            <section class="screen screen--start" data-id="start">
              <div class="hero">
                <div class="hero__rate">
                  <p class="hello" data-i18n="welcome.hello"></p>
                  <p class="rate-lead" data-i18n="rate.lead"></p>
                  <p class="rate-big"><span class="rate-big__sym">$</span><span class="num" data-bind="rate"></span></p>
                  <p class="rate-unit" data-i18n="rate.unit"></p>
                  <div class="pills">
                    <span class="pill pill--ok" data-bind="fee" data-i18n="rate.noFee"></span>
                    <span class="pill" data-bind="cap.note"></span>
                  </div>
                </div>
                <div class="hero__table">
                  <div class="tbl__head"><span>USD</span><span></span><span>MXN</span></div>
                  <ul class="tbl" data-bind="table.rows"></ul>
                </div>
              </div>

              <div class="privacy">
                <img class="privacy__qr" src="assets/img/qr-privacidad.svg" alt="">
                <div class="privacy__text">
                  <p class="privacy__line" data-i18n="privacy.line"></p>
                  <p class="privacy__more"><span data-i18n="privacy.qr"></span> <b>modo.exchange/privacy</b></p>
                </div>
              </div>
            </section>

            <!-- ── 2 · Inserta tus dólares ── -->
            <section class="screen screen--insert" data-id="insert">
              <header class="ins__head">
                <div>
                  <h2 class="title" data-i18n="insert.title"></h2>
                  <p class="sub" data-i18n="insert.sub"></p>
                </div>
                <div class="rate-pill">
                  <span class="rate-pill__lbl" data-i18n="insert.rateLine"></span>
                  <span class="num rate-pill__val" data-bind="ins.rate"></span>
                  <span class="rate-pill__cur">MXN / USD</span>
                </div>
              </header>

              <div class="figures">
                <div class="fig">
                  <span class="fig__lbl" data-i18n="insert.entered"></span>
                  <span class="fig__val" data-bind="ins.entered"></span>
                </div>
                <span class="figures__arrow" aria-hidden="true"><svg class="icon"><use href="#i-arrow-right"/></svg></span>
                <div class="fig fig--hero">
                  <span class="fig__lbl" data-i18n="insert.receive"></span>
                  <span class="fig__val" data-bind="ins.receive"></span>
                </div>
              </div>

              <div class="cap">
                <div class="cap__track"><span class="cap__fill" data-bind="ins.bar"></span></div>
                <span class="cap__lbl" data-bind="ins.limit"></span>
              </div>

              <p class="banner" data-bind="ins.banner" hidden></p>

              <div class="ins__body">
                <div class="ins__clip">
                  <p class="ins__note" data-i18n="video.caption"></p>
                  <div class="ins__art" aria-hidden="true">
                    <video src="assets/video/cash-in.mp4" autoplay muted loop playsinline></video>
                  </div>
                </div>

                <div class="bill-feed is-empty" data-bind="ins.feed">
                  <div class="notice" data-bind="notice" hidden role="alert">
                    <svg class="icon"><use href="#i-alert"/></svg>
                    <span data-bind="notice.text"></span>
                  </div>
                  <div class="bill-empty"><p data-i18n="insert.empty"></p></div>
                  <ul class="bill-list" data-bind="ins.list"></ul>
                </div>
              </div>
            </section>

            <!-- ── 3 · Confirmación ── -->
            <section class="screen screen--confirm" data-id="confirm">
              <h2 class="title title--center" data-i18n="confirm.title"></h2>

              <div class="cf__usd">
                <span class="cf__lbl" data-i18n="confirm.inserted"></span>
                <span class="cf__val" data-bind="cf.usd"></span>
              </div>

              <div class="cf__hero">
                <span class="fig__lbl" data-i18n="confirm.receive"></span>
                <span class="fig__val" data-bind="cf.mxn"></span>
              </div>

              <div class="rate-pill rate-pill--center">
                <span class="rate-pill__lbl" data-i18n="confirm.rate"></span>
                <span class="num rate-pill__val" data-bind="cf.rate"></span>
                <span class="rate-pill__cur">MXN / USD</span>
              </div>
            </section>

            <!-- ── 4 · Entrega: billetes → monedas → ticket ── -->
            <section class="screen screen--deliver" data-id="deliver">
              <header class="dv__head">
                <span class="spinner" data-bind="dv.spin"></span>
                <span class="dv__ok" data-bind="dv.ok" hidden><svg class="icon"><use href="#i-check"/></svg></span>
                <h2 class="title" data-bind="dv.title"></h2>
              </header>

              <ol class="dv__steps">
                <li class="dv__step" data-phase="0">
                  <span class="dv__dot"></span>
                  <div class="dv__txt">
                    <b data-i18n="deliver.bills"></b>
                  </div>
                </li>
                <li class="dv__step" data-phase="1">
                  <span class="dv__dot"></span>
                  <div class="dv__txt">
                    <b data-i18n="deliver.coins"></b>
                  </div>
                </li>
                <li class="dv__step" data-phase="2">
                  <span class="dv__dot"></span>
                  <div class="dv__txt">
                    <b data-i18n="deliver.ticket"></b>
                    <small data-bind="dv.printing" data-i18n="deliver.printing"></small>
                  </div>
                </li>
              </ol>

              <div class="receipt" data-bind="dv.receipt" hidden>
                <div class="receipt__row"><span data-i18n="receipt.folio"></span><b class="num" data-bind="dv.folio"></b></div>
                <div class="receipt__row"><span data-i18n="receipt.date"></span><b class="num" data-bind="dv.date"></b></div>
                <div class="receipt__row"><span data-i18n="receipt.usd"></span><span class="num" data-bind="dv.usd"></span></div>
                <div class="receipt__row"><span data-i18n="receipt.rate"></span><span class="num" data-bind="dv.rate"></span></div>
                <div class="receipt__total"><span data-i18n="deliver.delivered"></span><span class="num" data-bind="dv.mxn"></span></div>
              </div>

              <p class="dv__count" data-bind="dv.count" hidden></p>
            </section>

            <!-- ── Incidencia (improvisada): falla después de recibir el dinero ── -->
            <section class="screen screen--incident" data-id="incident">
              <div class="state-icon state-icon--danger"><svg class="icon"><use href="#i-alert"/></svg></div>
              <h2 class="title title--center" data-i18n="incident.title"></h2>
              <p class="lead" data-i18n="incident.text"></p>
              <div class="receipt">
                <div class="receipt__row"><span data-i18n="incident.folio"></span><b class="num" data-bind="inc.folio"></b></div>
                <div class="receipt__row"><span data-i18n="receipt.date"></span><b class="num" data-bind="inc.date"></b></div>
                <div class="receipt__row"><span data-i18n="receipt.usd"></span><span class="num" data-bind="inc.usd"></span></div>
                <div class="receipt__row"><span data-i18n="incident.phone"></span><b class="num" data-i18n="incident.phoneValue"></b></div>
              </div>
            </section>

            <!-- ── Fuera de servicio (improvisada) ── -->
            <section class="screen screen--oos" data-id="oos">
              <div class="state-icon state-icon--warn"><svg class="icon"><use href="#i-x-circle"/></svg></div>
              <h2 class="title title--center" data-i18n="oos.title"></h2>
              <p class="lead" data-i18n="oos.text"></p>
            </section>

          </div>

          <footer class="actions" id="actions">
            <div class="langs" id="langGroup" role="group" aria-label="Idioma">
              <button class="lang" type="button" data-lang="es"><svg class="flag"><use href="#flag-mx"/></svg><span>Español</span></button>
              <button class="lang" type="button" data-lang="en"><svg class="flag"><use href="#flag-us"/></svg><span>English</span></button>
            </div>
            <button class="btn" id="btnSecondary" type="button"><span class="btn__label"></span></button>
            <button class="btn" id="btnPrimary" type="button"><span class="btn__label"></span></button>
          </footer>

          <!-- ── Modales ── -->
          <div class="modal-layer" id="modalLayer">

            <div class="modal" data-modal-id="validating" role="dialog" aria-live="polite">
              <div class="spinner"></div>
              <h3 class="modal__title" data-i18n="validating.title"></h3>
              <p class="modal__text" data-i18n="validating.text"></p>
            </div>

            <div class="modal" data-modal-id="cancel" role="alertdialog">
              <div class="modal__icon modal__icon--warn"><svg class="icon"><use href="#i-alert"/></svg></div>
              <h3 class="modal__title" data-i18n="cancel.title"></h3>
              <p class="modal__text" data-i18n="cancel.text"></p>
              <div class="modal__actions">
                <button class="btn btn--light btn--modal" type="button" data-action="cancel-keep"><span class="btn__label" data-i18n="cancel.keep"></span></button>
                <button class="btn btn--danger btn--modal" type="button" data-action="cancel-yes"><span class="btn__label" data-i18n="cancel.yes"></span></button>
              </div>
            </div>

            <div class="modal" data-modal-id="returning" role="dialog" aria-live="polite">
              <div class="spinner"></div>
              <h3 class="modal__title" data-i18n="returning.title"></h3>
              <p class="modal__text" data-i18n="returning.text"></p>
            </div>

            <div class="modal" data-modal-id="error" role="alertdialog">
              <div class="modal__icon modal__icon--danger"><svg class="icon"><use href="#i-x-circle"/></svg></div>
              <h3 class="modal__title" data-i18n="error.title"></h3>
              <p class="modal__text" data-bind="error.text"></p>
              <div class="modal__actions">
                <button class="btn btn--cyan btn--modal" type="button" data-action="error-ok"><span class="btn__label" data-i18n="error.ok"></span></button>
              </div>
            </div>

            <div class="modal" data-modal-id="idle" role="alertdialog">
              <div class="modal__icon modal__icon--info"><svg class="icon"><use href="#i-clock"/></svg></div>
              <h3 class="modal__title" data-i18n="idle.title"></h3>
              <p class="modal__text" data-bind="idle.text"></p>
              <div class="modal__actions">
                <button class="btn btn--cyan btn--modal" type="button" data-action="idle-ok"><span class="btn__label" data-i18n="idle.ok"></span></button>
              </div>
            </div>

          </div>
        </div>
        <!-- ===================== /KIOSCO ===================== -->

      </div>
    </div>
    <div class="pv-meta" id="pvMeta"></div>
  </main>
</div>

<script src="js/i18n.js"></script>
<script src="js/app.js"></script>
<script src="js/preview.js"></script>
</body>
</html>
